name: ChatGPT Connections Production Monitor

on:
  workflow_dispatch:

concurrency:
  group: chatgpt-connections-production-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm monitor:production -- --output production-monitor-receipt.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-receipt
          path: production-monitor-receipt.json
          if-no-files-found: error
          retention-days: 30
